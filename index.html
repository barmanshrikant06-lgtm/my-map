
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Map</title>

    <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .map-title {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #0003;
        }

        .map-title h2 {
            font-size: 19px;
            color: #222;
        }

        .map-title p {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            background: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 12px #0003;
        }

        button:hover {
            background: #e8f0ff;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="map-title">
    <h2>🌍 3D World Map</h2>
    <p>Interactive 3D Map Experience</p>
</div>

<div class="controls">
    <button onclick="resetMap()">Reset View</button>
    <button onclick="rotateMap()">Rotate 3D</button>
    <button onclick="myLocation()">My Location</button>
</div>

<script>

    // Create map
    const map = new maplibregl.Map({
        container: 'map',

        // 3D-compatible vector map style
        style: 'https://demotiles.maplibre.org/style.json',

        center: [72.8777, 19.0760], // Mumbai

        zoom: 14,

        pitch: 60,

        bearing: -20,

        antialias: true
    });

    // Navigation controls
    map.addControl(
        new maplibregl.NavigationControl({
            visualizePitch: true
        }),
        'top-right'
    );

    // Add 3D buildings
    map.on('load', () => {

        const layers = map.getStyle().layers;

        let labelLayerId;

        for (const layer of layers) {
            if (
                layer.type === 'symbol' &&
                layer.layout &&
                layer.layout['text-field']
            ) {
                labelLayerId = layer.id;
                break;
            }
        }

        map.addLayer({
            id: '3d-buildings',

            source: 'openmaptiles',

            'source-layer': 'building',

            type: 'fill-extrusion',

            minzoom: 13,

            filter: ['!=', ['get', 'hide_3d'], true],

            paint: {
                'fill-extrusion-color': '#aaa',

                'fill-extrusion-height': [
                    'interpolate',
                    ['linear'],
                    ['zoom'],
                    13, 0,
                    16, ['get', 'render_height']
                ],

                'fill-extrusion-base': [
                    'coalesce',
                    ['get', 'render_min_height'],
                    0
                ],

                'fill-extrusion-opacity': 0.85
            }

        }, labelLayerId);

    });

    // Reset map
    function resetMap() {
        map.flyTo({
            center: [72.8777, 19.0760],
            zoom: 14,
            pitch: 60,
            bearing: -20,
            duration: 2000
        });
    }

    // Rotate map
    function rotateMap() {
        map.easeTo({
            bearing: map.getBearing() + 90,
            pitch: 65,
            duration: 2000
        });
    }

    // Current location
    function myLocation() {

        if (!navigator.geolocation) {
            alert('Geolocation is not supported!');
            return;
        }

        navigator.geolocation.getCurrentPosition(position => {

            const lng = position.coords.longitude;
            const lat = position.coords.latitude;

            map.flyTo({
                center: [lng, lat],
                zoom: 17,
                pitch: 65,
                duration: 2000
            });

            new maplibregl.Marker({
                color: 'red'
            })
            .setLngLat([lng, lat])
            .setPopup(
                new maplibregl.Popup().setText('Your Current Location')
            )
            .addTo(map);

        }, () => {
            alert('Unable to get your location.');
        });
    }

</script>

</body>
</html>
